<!doctype html>
<html lang="{{ site.lang }}">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
        <meta name="description" content="{{ page.lede | default: site.tagline | strip_html }}">
        <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
        <script type="module" src="{{ '/assets/charts.js' | relative_url }}"></script>
        <script type="module" src="{{ '/assets/nav.js' | relative_url }}"></script>
    </head>
    <body{% if page.layout == "article" %} class="is-article"{% endif %}>
        <header class="site-header">
            <div class="wrap site-header-inner">
                <a class="site-title" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} — domů"><img src="{{ '/assets/img/cesko-v-cislech-hlavicka-svetla.svg' | relative_url }}" alt="{{ site.title }}" width="612" height="100"></a>
                <nav class="site-nav" aria-label="Hlavní navigace">
                    <a href="{{ '/#temata' | relative_url }}">Témata</a>
                    <a href="{{ '/#o-projektu' | relative_url }}">O projektu</a>
                </nav>
            </div>
        </header>
        {% if page.layout == "article" %}
        <div class="wrap article-page">
            {% include sidenav.html %}
            <main>
{{ content }}
            </main>
        </div>
        {% else %}
        <main class="home">
{{ content }}
        </main>
        {% endif %}
        <footer class="site-footer">
            <div class="wrap site-footer-inner">{{ site.title }} · grafy i data lze volně stáhnout a použít</div>
        </footer>
    </body>
</html>
