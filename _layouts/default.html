<!doctype html>
<html lang="{{ site.lang }}">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
        <meta name="description" content="{{ page.lede | default: site.tagline | strip_html }}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
        <script type="module" src="{{ '/assets/charts.js' | relative_url }}"></script>
        <script type="module" src="{{ '/assets/nav.js' | relative_url }}"></script>
    </head>
    <body{% if page.layout == "article" %} class="has-sidenav"{% endif %}>
        <header class="site-header">
            <div class="site-header-inner">
                <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
                <span class="site-tagline">{{ site.tagline }}</span>
            </div>
        </header>
        <div class="page">
            {% if page.layout == "article" %}{% include sidenav.html %}{% endif %}
            <main>
{{ content }}
            </main>
        </div>
        <footer class="site-footer">
            <div class="site-footer-inner">
                {{ site.title }} · grafy i data lze volně stáhnout a použít
            </div>
        </footer>
    </body>
</html>
